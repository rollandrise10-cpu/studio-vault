<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="monetag" content="4e44f66fe7a62267ada55413cc20de14">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Studio Vault - Ultra DevEx & Robux Tax Profit Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #07080c;
      color: #e2e8f0;
      padding: 16px;
      overflow-x: hidden;
    }

    /* --- 3-SECOND COOL LOADING SCREEN --- */
    #loader-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #050608;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loader-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.5);
    }
    .loader-spinner-ring {
      width: 70px;
      height: 70px;
      border: 4px solid rgba(255, 255, 255, 0.05);
      border-top: 4px solid #00e676;
      border-right: 4px solid #0084ff;
      border-radius: 50%;
      animation: spinRing 1s linear infinite;
      margin-bottom: 20px;
    }
    .loader-status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Glow backdrops */
    .bg-glow-1 {
      position: fixed; top: -100px; left: -100px; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,230,118,0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: -1; pointer-events: none;
    }
    .bg-glow-2 {
      position: fixed; bottom: -100px; right: -100px; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,132,255,0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: -1; pointer-events: none;
    }

    .app-container { max-width: 1140px; margin: 0 auto; }

    /* Top Ad Banner */
    .ad-banner-slot {
      background: rgba(18, 19, 25, 0.8);
      border: 2px dashed rgba(0, 230, 118, 0.3);
      border-radius: 12px;
      text-align: center;
      padding: 16px;
      margin-bottom: 20px;
      color: #00e676;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.05);
      transition: all 0.3s;
    }
    .ad-banner-slot:hover { border-color: #00e676; box-shadow: 0 0 20px rgba(0, 230, 118, 0.15); }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(21, 22, 28, 0.9) 0%, rgba(15, 16, 22, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }
    .brand-badge {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .audio-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .audio-toggle-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    /* Grid Layout */
    .main-grid { display: grid; grid-template-columns: 2.1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .main-grid { grid-template-columns: 1fr; } }

    /* Calculator Cards */
    .calc-card {
      background: rgba(21, 22, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 1.1rem; color: #0084ff; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-box {
      width: 100%;
      background: #0f1015;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      outline: none;
      transition: all 0.2s;
    }
    .input-box:focus { border-color: #0084ff; box-shadow: 0 0 12px rgba(0, 132, 255, 0.3); }

    /* Results Displays */
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .result-box {
      background: #0f101b;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }
    .res-label { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; font-weight: 700; }
    .res-val { font-size: 1.25rem; color: #00e676; font-weight: 900; }

    /* VIP Gate Box */
    .vip-gate-card {
      background: linear-gradient(135deg, rgba(255, 179, 0, 0.08) 0%, rgba(21, 22, 28, 0.95) 100%);
      border: 1px solid rgba(255, 179, 0, 0.3);
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
      text-align: center;
      position: relative;
    }
    .vip-title { color: #ffb300; font-weight: 900; font-size: 1rem; margin-bottom: 6px; }
    .vip-sub { color: #94a3b8; font-size: 0.82rem; margin-bottom: 14px; }

    .progress-bar-track {
      background: #0a0b0e;
      border-radius: 20px;
      height: 14px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #ff9100 0%, #ffc400 100%);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 10px rgba(255, 179, 0, 0.5);
    }

    .btn-action {
      background: linear-gradient(135deg, #ffb300 0%, #ff8f00 100%);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 179, 0, 0.2);
      transition: all 0.2s;
    }
    .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 179, 0, 0.4); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .vip-panel-unlocked {
      display: none;
      background: #0d0e14;
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    /* Chart Container */
    .chart-box {
      margin-top: 16px;
      background: #0b0c10;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Reference Table */
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.85rem; }
    th { color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.72rem; }
    td { color: #fff; font-weight: 700; }

    /* Share Button */
    .share-btn {
      background: rgba(0, 132, 255, 0.15);
      color: #0084ff;
      border: 1px solid rgba(0, 132, 255, 0.4);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      transition: 0.2s;
    }
    .share-btn:hover { background: rgba(0, 132, 255, 0.25); color: #fff; }
  </style>
</head>
